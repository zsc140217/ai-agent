  ai:
    dashscope:
      # 需要替换为你自己的 key
      api-key: sk-861e1fe002f04f8ea132731f38f0a566
      chat:
        options:
          model: qwen-max
      embedding:
        options:
          # 可选模型：text-embedding-v1（默认）、text-embedding-v2、text-embedding-v3
          # v2/v3 可能有更好的效果，但需要确认你的百炼账号是否有额度
          model: text-embedding-v2
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma3:1b
      embedding:
        options:
          model: bge-m3  # 向量检索模型（BGE系列，中文优化）

# Ollama 重排序配置
ollama:
  base-url: http://localhost:11434
  reranker:
    model: bge-reranker-v2-m3  # Cross-Encoder重排序模型
    mcp:
      client:
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8127
        stdio:
          servers-configuration: classpath:mcp-servers.json
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000

# 和风天气 API 配置
qweather:
  api-key: 21fbbbf3b8fb4932b68ca51544dfbb8b
  api-host: mr487tqjdj.re.qweatherapi.com
  cli-path: tools/weather-cli.js

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi config
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.jblmj.aiagent.controller
# knife4j config
knife4j:
  enable: true
  setting:
    language: zh_cn
# searchAPI
search-api:
  # 需要替换为你自己的 key
  api-key: LTFB4kSeNuuA7FxmEMCGVWxs
# 修改日志级别，查看 Spring AI 更多调用细节
logging:
  level:
    org.springframework.ai: DEBUG

# 对话记忆系统配置
chat:
  memory:
    storage:
      path: ./data/chat-history  # 短期记忆存储路径
    window:
      size: 20  # 滑动窗口大小（保留最近20条消息）
    longterm:
      path: ./data/user-profiles  # 长期记忆（用户画像）存储路径
